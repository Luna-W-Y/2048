<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👶 宝宝2048</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fef9e7 0%, #fdebd0 50%, #fadbd8 100%);
            font-family: 'Segoe UI', '微软雅黑', sans-serif;
            padding: 16px;
            overflow-x: hidden;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #b9770e;
            margin-bottom: 4px;
            text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.8);
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 13px;
            color: #a0704a;
            margin-bottom: 14px;
        }

        /* 顶部信息栏 */
        .top-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            align-items: center;
        }

        .score-box {
            background: #fff8ec;
            border: 2px solid #f0c078;
            border-radius: 12px;
            padding: 8px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(240, 192, 120, 0.3);
            min-width: 90px;
        }

        .score-box .label {
            font-size: 11px;
            color: #b9770e;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .score-box .value {
            font-size: 22px;
            font-weight: 800;
            color: #935116;
            line-height: 1.1;
        }

        .new-game-btn {
            background: linear-gradient(135deg, #f5b041, #eb984e);
            border: none;
            border-radius: 12px;
            padding: 12px 22px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(235, 152, 78, 0.4);
            transition: all 0.2s;
        }

        .new-game-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(235, 152, 78, 0.6);
        }

        .new-game-btn:active {
            transform: translateY(0);
        }

        /* 棋盘容器 */
        .board-wrapper {
            position: relative;
            background: #f0c078;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(185, 119, 14, 0.3);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            width: min(90vw, 460px);
            height: min(90vw, 460px);
            position: relative;
        }

        .cell {
            background: #fdebd0;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(185, 119, 14, 0.15);
        }

        /* 照片块 */
        .tile {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.12s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
        }

        /* 等级标识 (小角标) */
        .tile::after {
            content: attr(data-level);
            position: absolute;
            bottom: 4px;
            right: 6px;
            background: rgba(0, 0, 0, 0.45);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 1px 7px;
            border-radius: 10px;
            backdrop-filter: blur(2px);
        }

        /* 最高级（2048）加个金边光效 */
        .tile[data-level="2048"] {
            box-shadow: 0 0 0 3px #f1c40f, 0 0 20px rgba(241, 196, 15, 0.8);
            animation: glow 1.5s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 0 3px #f1c40f, 0 0 15px rgba(241, 196, 15, 0.6); }
            to   { box-shadow: 0 0 0 3px #f39c12, 0 0 30px rgba(243, 156, 18, 1); }
        }

        /* 新生成/合并动画 */
        .tile.pop {
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0.5; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .tile.merged {
            animation: merged 0.25s ease;
        }

        @keyframes merged {
            0% { transform: scale(1); }
            50% { transform: scale(1.18); }
            100% { transform: scale(1); }
        }

        /* 游戏结束 / 胜利遮罩 */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 248, 236, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.show {
            opacity: 1;
            pointer-events: all;
        }

        .overlay h2 {
            font-size: 38px;
            color: #b9770e;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 white;
        }

        .overlay p {
            font-size: 16px;
            color: #a0704a;
            margin-bottom: 20px;
        }

        .overlay p span {
            font-weight: 800;
            color: #d35400;
            font-size: 20px;
        }

        .overlay button {
            padding: 12px 36px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #f5b041, #eb984e);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(235, 152, 78, 0.5);
            transition: transform 0.2s;
        }

        .overlay button:hover {
            transform: scale(1.05);
        }

        .tip {
            margin-top: 14px;
            font-size: 13px;
            color: #a0704a;
        }

        /* 移动端适配 */
        @media (max-width: 480px) {
            h1 { font-size: 26px; }
            .score-box { padding: 6px 14px; min-width: 70px; }
            .score-box .value { font-size: 18px; }
            .new-game-btn { padding: 10px 16px; font-size: 13px; }
            .board { gap: 8px; }
            .tile::after { font-size: 9px; padding: 1px 5px; bottom: 3px; right: 4px; }
        }
    </style>
</head>
<body>

    <h1>👶 宝宝2048</h1>
    <div class="subtitle">把两个相同的宝宝合在一起，进化成最终形态！</div>

    <!-- 分数栏 -->
    <div class="top-bar">
        <div class="score-box">
            <div class="label">得分</div>
            <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="label">最高</div>
            <div class="value" id="best">0</div>
        </div>
        <button class="new-game-btn" id="newGameBtn">🔄 新游戏</button>
    </div>

    <!-- 棋盘 -->
    <div class="board-wrapper">
        <div class="board" id="board"></div>

        <!-- 游戏结束遮罩 -->
        <div class="overlay" id="gameOverlay">
            <h2 id="overlayTitle">游戏结束</h2>
            <p>得分：<span id="overlayScore">0</span></p>
            <button id="overlayBtn">再来一局</button>
        </div>
    </div>

    <div class="tip">⌨️ 用方向键移动 &nbsp;|&nbsp; 📱 手机可滑动屏幕</div>

    <script>
        (function() {
            'use strict';

            // ============================================
            //  🖼️ 照片配置区 —— 你只需要改这里！
            // ============================================
            // 按顺序放：2 → 4 → 8 → 16 → 32 → 64 → 128 → 256 → 512 → 1024 → 2048
            // 把你准备的 11 张照片放在和这个 html 同一个文件夹里，
            // 然后把下面的 '1.jpg' 改成实际文件名即可。
            // 如果照片在子文件夹里，写 'images/1.jpg' 这样。
            // 也可以直接换成网络图片链接，比如 'https://xxx.com/1.jpg'
            // ============================================
            const PHOTO_CONFIG = [
                { level: 2,    src: '1.jpg'  },  // 第1张：熟睡宝宝
                { level: 4,    src: '2.jpg'  },  // 第2张：不屑宝宝
                { level: 8,    src: '3.jpg'  },  // 第3张：大眼宝宝
                { level: 16,   src: '4.jpg'  },  // 第4张：莲花宝宝
                { level: 32,   src: '5.jpg'  },  // 第5张：黄帽宝宝
                { level: 64,   src: '6.jpg'  },  // 第6张：托腮宝宝
                { level: 128,  src: '7.jpg'  },  // 第7张：张嘴宝宝
                { level: 256,  src: '8.jpg'  },  // 第8张：玩积木宝宝
                { level: 512,  src: '9.jpg'  },  // 第9张：躺床宝宝
                { level: 1024, src: '10.jpg' },  // 第10张：白帽宝宝
                { level: 2048, src: '11.jpg' }   // 第11张：咬嘴唇宝宝
            ];

            // 根据等级取图片
            function getPhoto(level) {
                const item = PHOTO_CONFIG.find(p => p.level === level);
                return item ? item.src : '';
            }

            // ============================================
            //  游戏核心逻辑
            // ============================================

            const SIZE = 4;
            const boardEl = document.getElementById('board');
            const scoreEl = document.getElementById('score');
            const bestEl = document.getElementById('best');
            const overlay = document.getElementById('gameOverlay');
            const overlayTitle = document.getElementById('overlayTitle');
            const overlayScore = document.getElementById('overlayScore');
            const overlayBtn = document.getElementById('overlayBtn');
            const newGameBtn = document.getElementById('newGameBtn');

            let grid = [];              // 4x4 二维数组，0表示空
            let score = 0;
            let best = parseInt(localStorage.getItem('baby2048_best') || '0');
            let gameOver = false;
            let won = false;
            let mergedCells = [];       // 记录本回合合并的格子，用于动画

            // 初始化
            function initGame() {
                grid = Array(SIZE).fill(null).map(() => Array(SIZE).fill(0));
                score = 0;
                gameOver = false;
                won = false;
                mergedCells = [];
                updateScore();
                overlay.classList.remove('show');
                addRandomTile();
                addRandomTile();
                renderBoard();
            }

            // 在空格中随机生成一个 2 或 4
            function addRandomTile() {
                const empty = [];
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (grid[r][c] === 0) empty.push({ r, c });
                    }
                }
                if (empty.length === 0) return null;
                const { r, c } = empty[Math.floor(Math.random() * empty.length)];
                // 90% 概率出 2，10% 概率出 4
                grid[r][c] = Math.random() < 0.9 ? 2 : 4;
                return { r, c };
            }

            // 渲染棋盘
            function renderBoard(animations = {}) {
                boardEl.innerHTML = '';
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.row = r;
                        cell.dataset.col = c;

                        const val = grid[r][c];
                        if (val !== 0) {
                            const tile = document.createElement('div');
                            tile.className = 'tile';
                            tile.dataset.level = val;
                            const photoSrc = getPhoto(val);
                            if (photoSrc) {
                                tile.style.backgroundImage = `url('${photoSrc}')`;
                            } else {
                                // 找不到图片时的后备显示
                                tile.style.background = '#f5b041';
                                tile.textContent = val;
                            }

                            // 新生成动画
                            if (animations.newTiles && animations.newTiles.some(p => p.r === r && p.c === c)) {
                                tile.classList.add('pop');
                            }
                            // 合并动画
                            if (mergedCells.some(p => p.r === r && p.c === c)) {
                                tile.classList.add('merged');
                            }

                            cell.appendChild(tile);
                        }
                        boardEl.appendChild(cell);
                    }
                }
            }

            // 更新分数显示
            function updateScore() {
                scoreEl.textContent = score;
                if (score > best) {
                    best = score;
                    localStorage.setItem('baby2048_best', best);
                }
                bestEl.textContent = best;
            }

            // ============================================
            //  移动逻辑
            // ============================================

            // 将一行向左压缩合并，返回新行 + 得分 + 合并位置
            function slideLine(line) {
                // 去掉 0
                let arr = line.filter(v => v !== 0);
                let gained = 0;
                const mergedIndices = []; // 记录合并后新值所在的索引（相对压缩后的数组）

                // 合并
                for (let i = 0; i < arr.length - 1; i++) {
                    if (arr[i] === arr[i + 1]) {
                        arr[i] *= 2;
                        gained += arr[i];
                        arr.splice(i + 1, 1);
                        mergedIndices.push(i);
                    }
                }

                // 补 0 到长度 4
                while (arr.length < SIZE) arr.push(0);
                return { newLine: arr, gained, mergedIndices };
            }

            // 执行移动 direction: 'left' | 'right' | 'up' | 'down'
            function move(direction) {
                if (gameOver) return;

                const prevGrid = grid.map(row => [...row]);
                mergedCells = [];
                let gainedTotal = 0;
                const newTiles = [];

                // 根据方向处理每一行/列
                if (direction === 'left') {
                    for (let r = 0; r < SIZE; r++) {
                        const { newLine, gained, mergedIndices } = slideLine(grid[r]);
                        grid[r] = newLine;
                        gainedTotal += gained;
                        mergedIndices.forEach(idx => mergedCells.push({ r, c: idx }));
                    }
                } else if (direction === 'right') {
                    for (let r = 0; r < SIZE; r++) {
                        const reversed = [...grid[r]].reverse();
                        const { newLine, gained, mergedIndices } = slideLine(reversed);
                        const finalLine = newLine.reverse();
                        grid[r] = finalLine;
                        gainedTotal += gained;
                        mergedIndices.forEach(idx => {
                            const c = SIZE - 1 - idx;
                            mergedCells.push({ r, c });
                        });
                    }
                } else if (direction === 'up') {
                    for (let c = 0; c < SIZE; c++) {
                        const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
                        const { newLine, gained, mergedIndices } = slideLine(col);
                        for (let r = 0; r < SIZE; r++) grid[r][c] = newLine[r];
                        gainedTotal += gained;
                        mergedIndices.forEach(idx => mergedCells.push({ r: idx, c }));
                    }
                } else if (direction === 'down') {
                    for (let c = 0; c < SIZE; c++) {
                        const col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]].reverse();
                        const { newLine, gained, mergedIndices } = slideLine(col);
                        const finalCol = newLine.reverse();
                        for (let r = 0; r < SIZE; r++) grid[r][c] = finalCol[r];
                        gainedTotal += gained;
                        mergedIndices.forEach(idx => {
                            const r = SIZE - 1 - idx;
                            mergedCells.push({ r, c });
                        });
                    }
                }

                // 检查是否有变化
                const changed = grid.some((row, r) => row.some((v, c) => v !== prevGrid[r][c]));
                if (!changed) return;

                // 加分
                score += gainedTotal;
                updateScore();

                // 生成新数字
                const newTile = addRandomTile();
                if (newTile) newTiles.push(newTile);

                // 渲染
                renderBoard({ newTiles });

                // 检查胜利 / 失败
                checkGameState();
            }

            // 检查游戏状态
            function checkGameState() {
                // 检查是否出现 2048
                if (!won) {
                    for (let r = 0; r < SIZE; r++) {
                        for (let c = 0; c < SIZE; c++) {
                            if (grid[r][c] === 2048) {
                                won = true;
                                showOverlay('🎉 合成最终宝宝！', '你赢啦！');
                                return;
                            }
                        }
                    }
                }

                // 检查是否无法移动
                if (!canMove()) {
                    gameOver = true;
                    showOverlay('😵 没有位置了', '游戏结束');
                }
            }

            // 判断是否还能移动
            function canMove() {
                // 有空位就能动
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        if (grid[r][c] === 0) return true;
                    }
                }
                // 检查相邻相同
                for (let r = 0; r < SIZE; r++) {
                    for (let c = 0; c < SIZE; c++) {
                        const v = grid[r][c];
                        if (c < SIZE - 1 && grid[r][c + 1] === v) return true;
                        if (r < SIZE - 1 && grid[r + 1][c] === v) return true;
                    }
                }
                return false;
            }

            // 显示遮罩
            function showOverlay(title, sub) {
                overlayTitle.textContent = title;
                overlayScore.textContent = score;
                overlay.classList.add('show');
            }

            // ============================================
            //  事件绑定
            // ============================================

            // 键盘
            document.addEventListener('keydown', (e) => {
                const keyMap = {
                    'ArrowLeft': 'left',
                    'ArrowRight': 'right',
                    'ArrowUp': 'up',
                    'ArrowDown': 'down',
                    'a': 'left', 'd': 'right', 'w': 'up', 's': 'down',
                    'A': 'left', 'D': 'right', 'W': 'up', 'S': 'down'
                };
                const dir = keyMap[e.key];
                if (dir) {
                    e.preventDefault();
                    move(dir);
                }
            });

            // 触摸滑动
            let touchStartX = 0, touchStartY = 0;
            let touchMoved = false;

            boardEl.addEventListener('touchstart', (e) => {
                if (e.touches.length !== 1) return;
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchMoved = false;
            }, { passive: true });

            boardEl.addEventListener('touchmove', (e) => {
                if (e.touches.length !== 1) return;
                e.preventDefault(); // 阻止页面滚动
                const dx = e.touches[0].clientX - touchStartX;
                const dy = e.touches[0].clientY - touchStartY;
                const absDx = Math.abs(dx);
                const absDy = Math.abs(dy);

                if (Math.max(absDx, absDy) < 30) return; // 滑动阈值
                if (touchMoved) return;
                touchMoved = true;

                if (absDx > absDy) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
            }, { passive: false });

            // 按钮
            newGameBtn.addEventListener('click', initGame);
            overlayBtn.addEventListener('click', () => {
                overlay.classList.remove('show');
                initGame();
            });

            // 启动
            initGame();

        })();
    </script>
</body>
</html>
